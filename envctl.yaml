# envctl's own workflow configuration, for dogfooding the workflow runtime.
# See https://sam-bretz.github.io/envctl/first-workflow/
version: 2
project: envctl
repositories:
  - id: envctl
    url: https://github.com/sam-bretz/envctl.git
    ref: main
runtime:
  memory_gib: 6
stack:
  files: [compose.workflow.yaml]
limits:
  vms: 2
workflow:
  template: feature
  nodes:
    design:
      prompt: &go "This VM has Docker but no Go toolchain. Run Go through the Compose toolbox service, or directly with: docker run --rm -v \"$PWD\":/src -w /src -e GOFLAGS=-buildvcs=false -v envctl-gomod:/go/pkg/mod -v envctl-gocache:/root/.cache/go-build golang:1.25 go test ./... . Follow the conventions of the surrounding code and docs/, and keep gofmt, go vet and go test passing."
    # Code and QA are checked by their own tests and an independent supervisor
    # on the default model, so their workers use the faster, cheaper Sonnet.
    code:
      prompt: *go
      agents: {worker: {model: sonnet}}
    qa:
      prompt: *go
      agents: {worker: {model: sonnet}}
      checks: &checks
        - name: vet
          command: [sh, -c, 'docker run --rm -v "$PWD":/src -w /src -e GOFLAGS=-buildvcs=false -v envctl-gomod:/go/pkg/mod -v envctl-gocache:/root/.cache/go-build golang:1.25 sh -c "test -z \"\$(gofmt -l cmd internal)\" && go vet ./..."']
          timeout_seconds: 900
        - name: test
          command: [sh, -c, 'docker run --rm -v "$PWD":/src -w /src -e GOFLAGS=-buildvcs=false -v envctl-gomod:/go/pkg/mod -v envctl-gocache:/root/.cache/go-build golang:1.25 go test ./...']
          timeout_seconds: 1800
# Smaller changes skip Design and QA: envctl run create --workflow small
workflows:
  small:
    template: small
    nodes:
      build:
        prompt: *go
        checks: *checks
        agents: {worker: {model: sonnet}}
agents:
  worker:
    kind: claude
    credential: file:/Users/samuelbretz/.config/envctl/claude-token.json
  supervisor:
    kind: claude
    credential: file:/Users/samuelbretz/.config/envctl/claude-token.json

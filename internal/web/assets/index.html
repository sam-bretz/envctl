<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="envctl-token" content="{{.Token}}">
<title>envctl</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/app.js" defer></script>
</head>
<body>
<header class="bar">
  <button class="bar-menu" id="menu" type="button" aria-controls="runs" aria-expanded="false">Runs</button>
  <a class="wordmark" href="/">envctl</a>
  <span class="bar-root" id="root"></span>
  <span class="bar-link" id="link" role="status"></span>
  <span class="bar-spacer"></span>
  <button type="button" class="quiet" id="help-open" title="Keyboard shortcuts (?)">Shortcuts</button>
  <label class="theme-pick"><span class="visually-hidden">Theme</span><select id="theme"></select></label>
  <button type="button" class="primary" id="new-run" title="Start a new run (n)">New run</button>
</header>

<div class="layout">
  <aside class="runs" id="runs" aria-label="Runs"></aside>

  <main class="run" id="run">
    <section class="run-head" id="run-head"></section>
    <section class="banner" id="banner" hidden></section>
    <nav class="track" id="track" aria-label="Stages"></nav>
    <section class="stage-head" id="stage-head"></section>
    <div class="tabs" id="tabs" role="tablist" aria-label="Stage views"></div>
    <section class="panel" id="panel" role="tabpanel"></section>
    <form class="composer" id="composer" hidden>
      <div class="recipient" role="radiogroup" aria-label="Send to">
        <label><input type="radio" name="recipient" value="supervisor" checked><span>Supervisor</span></label>
        <label><input type="radio" name="recipient" value="worker"><span>Worker</span></label>
      </div>
      <label class="visually-hidden" for="message">Message</label>
      <textarea id="message" rows="2" placeholder="Steer this stage. Enter sends, Shift+Enter adds a line."></textarea>
      <button type="submit" class="primary" id="send">Send to supervisor</button>
    </form>
  </main>
</div>

<div class="status" id="status" role="status" aria-live="polite"></div>

<aside class="reader" id="reader" hidden aria-label="Artifact">
  <header class="reader-head">
    <div>
      <h2 id="reader-title"></h2>
      <p class="reader-meta" id="reader-meta"></p>
    </div>
    <button type="button" class="quiet" id="reader-close">Close</button>
  </header>
  <nav class="reader-files" id="reader-files" aria-label="Other artifacts in this checkpoint"></nav>
  <div class="reader-body" id="reader-body"></div>
</aside>

<dialog id="dialog"><form method="dialog" id="dialog-form"></form></dialog>
</body>
</html>
